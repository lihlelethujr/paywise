<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A5BFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PayWise">
<title>PayWise</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap">
<style>
:root{--bg:#F8F9FA;--sf:#fff;--ink:#202124;--mute:#5F6368;--blue:#1A73E8;--tonal:#E8F0FE;--tink:#1967D2;--ok:#188038;--line:#DADCE0;--onb:#fff;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Google Sans","Product Sans",Roboto,system-ui,sans-serif}
#app{max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden}
.pad{padding:56px 24px;overflow-y:auto}
.logo{width:72px;height:72px;border-radius:20px;background:var(--blue);color:var(--onb);font-size:46px;font-weight:500;display:flex;align-items:center;justify-content:center}
h1{font-size:26px;font-weight:500;margin:20px 0 6px}
h2{font-size:16px;font-weight:500;color:var(--mute);margin:20px 4px 10px}
.note{color:var(--mute);font-size:14px;margin:8px 4px}
.err{color:#D93025;margin:12px 4px}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px 8px}
.title{font-size:22px;font-weight:500}
.back{border:0;background:none;color:var(--blue);font:500 18px inherit;font-family:inherit}
.avb{border:0;background:none;padding:0;cursor:pointer}
.av{width:38px;height:38px;border-radius:50%;background:var(--blue);color:var(--onb);display:flex;align-items:center;justify-content:center;font-weight:500;object-fit:cover}
.avxl{width:110px;height:110px;font-size:44px}
main{flex:1;overflow-y:auto;padding:4px 16px 16px}
nav{display:flex;gap:4px;padding:8px}
nav button{flex:1;padding:12px 0;border:0;border-radius:16px;background:none;color:var(--mute);font:500 12.5px inherit;font-family:inherit}
nav button.on{background:var(--tonal);color:var(--tink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn{display:block;width:100%;border:0;border-radius:100px;padding:14px;font:500 15px inherit;font-family:inherit;background:var(--blue);color:var(--onb);margin-top:10px;cursor:pointer}
.btn.t{background:var(--tonal);color:var(--tink)}.btn.g{background:none;color:var(--blue)}
input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--sf);color:var(--ink);font:400 16px inherit;font-family:inherit;margin-bottom:10px}
.card{border-radius:20px;padding:18px;margin-bottom:12px;background:var(--sf);border:1px solid var(--line)}
.card strong{font-size:18px;font-weight:500}.card small{display:block;color:var(--mute);margin-top:6px;letter-spacing:1px}
.card.bank{background:var(--blue);color:var(--onb);border:0;min-height:130px;display:flex;flex-direction:column;justify-content:space-between}.card.bank small{color:var(--onb);opacity:.85}
.wc{border-radius:28px;padding:22px;min-height:190px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;margin-bottom:12px;box-shadow:0 6px 16px rgba(32,33,36,.18);cursor:pointer}
.wc.sm{min-height:130px;padding:18px}
.wc b{font-size:26px;font-weight:500;text-align:center;line-height:1.15}
.wl{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-weight:500}
.wn{font-size:19px;letter-spacing:1px}
.dots{display:flex;justify-content:center;gap:8px;margin:12px 0}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{width:22px;border-radius:8px;background:var(--ink)}
.bcp{background:#fff;border-radius:24px;padding:20px 24px;margin:16px 12px 8px;text-align:center}.bcp svg{width:100%;height:90px}
.num{text-align:center;font-size:20px;letter-spacing:1px;margin:8px 0 16px}
.tag{color:var(--ok);font-size:12px;margin-top:8px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:none;color:var(--ink);border-radius:100px;padding:8px 14px;font:400 14px inherit;font-family:inherit}
.chip.on{background:var(--tonal);border-color:var(--blue);color:var(--tink)}
.row{display:flex;justify-content:space-between;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.cam{aspect-ratio:1;border-radius:28px;background:#202124;overflow:hidden;position:relative}
.cam video{width:100%;height:100%;object-fit:cover}
.cam::after{content:"";position:absolute;inset:19%;border:3px solid #fff;border-radius:24px}
.qr{background:#fff;padding:14px;border-radius:24px;display:flex;justify-content:center;margin:12px 0;border:1px solid var(--line)}
.sheet{position:absolute;inset:auto 0 0 0;background:var(--sf);border-radius:28px 28px 0 0;padding:24px;box-shadow:0 -4px 24px rgba(0,0,0,.3);z-index:5}
.big{font-size:44px;margin:8px 0}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;z-index:9}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
var $=function(i){return document.getElementById(i)};
var S={user:null,cards:[],hist:[],payout:null},tab='wallet',scr='main',step='phone',tmp={},stream=null,raf=0,sel='';
var STORES=['Shoprite Xtra Savings','Pick n Pay Smart Shopper','Checkers Xtra Savings','Clicks ClubCard','Woolworths WRewards','Spar Rewards'];
var BANKS=['Capitec','FNB','Standard Bank','Absa','Nedbank','TymeBank'];
try{var d=JSON.parse(localStorage.getItem('pw'));if(d&&d.user)S=d}catch(e){}
function save(){try{localStorage.setItem('pw',JSON.stringify(S))}catch(e){}}
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(a){return 'R'+Number(a).toFixed(2)}
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;$('app').appendChild(t);setTimeout(function(){t.remove()},2500)}
function normPhone(p){p=p.replace(/\s/g,'');if(/^0\d{9}$/.test(p))return '+27'+p.slice(1);return /^\+27\d{9}$/.test(p)?p:null}
function validId(id){if(!/^\d{13}$/.test(id))return false;var mm=+id.slice(2,4),dd=+id.slice(4,6);if(mm<1||mm>12||dd<1||dd>31)return false;var s=0;for(var i=0;i<13;i++){var x=+id[12-i];if(i%2){x*=2;if(x>9)x-=9}s+=x}return s%10===0}
function parseTLV(s){var o={},i=0;while(i+4<=s.length){var l=parseInt(s.slice(i+2,i+4),10);if(isNaN(l))break;o[s.slice(i,i+2)]=s.slice(i+4,i+4+l);i+=4+l}return o}
function crc16(s){var c=0xffff;for(var i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(var j=0;j<8;j++)c=c&0x8000?(c<<1)^0x1021:c<<1;c&=0xffff}return c.toString(16).toUpperCase().padStart(4,'0')}
function f(t,v){return t+String(v.length).padStart(2,'0')+v}
function buildQR(name,amt,id){var p=f('00','01')+f('01',amt?'12':'11')+f('26',f('00','za.co.paywise')+f('01',id))+f('52','5411')+f('53','710');if(amt)p+=f('54',Number(amt).toFixed(2));p+=f('58','ZA')+f('59',name.slice(0,25))+f('60','ZA')+'6304';return p+crc16(p)}
function readQR(d){if(d.indexOf('000201')!==0||crc16(d.slice(0,-4))!==d.slice(-4))return null;var t=parseTLV(d);return{name:t['59']||'Merchant',amount:t['54']?parseFloat(t['54']):null}}
function err(m){var e=$('err');if(e)e.textContent=m}

function render(){stopCam();S.user?shell():auth()}
function auth(){
 var b='<div class="pad"><div class="logo">P</div>';
 if(step==='phone')b+='<h1>Welcome to PayWise</h1><p class="note">Enter your cell number to sign up or log in.</p><input id="ph" type="tel" placeholder="082 123 4567"><button class="btn" onclick="doPhone()">Continue</button>';
 if(step==='otp')b+='<h1>Enter your code</h1><p class="note">We sent a 6-digit code to '+esc(tmp.phone)+'. Demo code: 123456</p><input id="cd" inputmode="numeric" maxlength="6" placeholder="123456"><button class="btn" onclick="doOtp()">Verify</button><button class="btn g" onclick="step=\'phone\';render()">Use a different number</button>';
 if(step==='reg')b+='<h1>Finish your profile</h1><input id="nm" placeholder="Name"><input id="sn" placeholder="Surname"><input id="id" inputmode="numeric" maxlength="13" placeholder="ID number (13 digits)"><input id="em" type="email" placeholder="Email address"><p class="note">Demo: your full ID number is checked, then only a masked version is kept on this phone.</p><button class="btn" onclick="doReg()">Create account</button>';
 $('app').innerHTML=b+'<p class="err" id="err"></p></div>';
}
function doPhone(){var p=normPhone($('ph').value);if(!p)return err('Enter a valid South African number');tmp.phone=p;step='otp';render()}
function doOtp(){if($('cd').value!=='123456')return err('That code is wrong');step='reg';render()}
function doReg(){
 var n=$('nm').value.trim(),s=$('sn').value.trim(),id=$('id').value.trim(),e=$('em').value.trim();
 if(!n||!s)return err('Enter your name and surname');
 if(!validId(id))return err('That ID number is not valid');
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e))return err('Enter a valid email address');
 var l=tmp.phone.slice(-4);
 S={user:{name:n,surname:s,email:e,phone:tmp.phone,idm:id.slice(0,6)+'*******'},cards:[{store:STORES[0],num:'6009 '+l+' 0001',auto:1},{store:STORES[1],num:'9810 '+l+' 0002',auto:1}],hist:[],payout:null};
 save();tab='wallet';render();
}
function shell(){
 var u=S.user,av=u.photo?'<img class="av" src="'+u.photo+'" alt="">':'<span class="av">'+esc(u.name[0].toUpperCase())+'</span>';
 var top=scr!=='main'?'<button class="back" onclick="scr=\'main\';render()">‹ Back</button>':'<b class="title">PayWise</b><button class="avb" onclick="scr=\'profile\';render()" aria-label="Profile">'+av+'</button>';
 var nv='';if(scr==='main')nv='<nav>'+[['wallet','Wallet'],['scan','Scan'],['tap','Tap'],['buy','Transact'],['paid','Get paid']].map(function(t){return '<button class="'+(t[0]===tab?'on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>'}).join('')+'</nav>';
 $('app').innerHTML='<header>'+top+'</header><main id="body"></main>'+nv;
 if(scr==='profile')return profile();if(scr==='card')return cardView();if(scr==='add')return addScreen();if(scr==='bank')return bankScreen();if(scr==='tx')return (txk==='data'?dataScreen():txScreen());if(scr==='lotto')return lottoScreen();
 ({wallet:wallet,scan:scan,tap:tap,buy:buy,paid:paid})[tab]();
}
function go(t){tab=t;render()}
function chips(list,fn){return '<div class="chips">'+list.map(function(i){return '<button class="chip'+(sel===i?' on':'')+'" onclick="'+fn+'(this.textContent)">'+esc(i)+'</button>'}).join('')+'</div>'}
function wallet(){
 var bk=S.payout?'<div class="card bank"><strong>'+esc(S.payout.bank)+'</strong><small>•••• '+esc(S.payout.l4)+' · Payout account</small></div>':'<div class="card bank" onclick="go(\'paid\')" style="cursor:pointer"><strong>Link your bank account</strong><small>Get paid straight to your account</small></div>';var b='<h2>Bank cards</h2>'+bk+'<h2>Loyalty cards</h2>'+(S.cards.length?S.cards.map(function(c,i){return cardHTML(c,i,1)}).join(''):'<p class="note">No loyalty cards yet.</p>');
 b+='<button class="btn t" onclick="openAdd()">+ Add loyalty card</button><h2>Recent activity</h2>';
 b+=S.hist.length?S.hist.map(function(h){return '<div class="row"><span>'+(h.in?'From ':'To ')+esc(h.who)+'</span><b style="color:'+(h.in?'var(--ok)':'inherit')+'">'+(h.in?'+':'-')+money(h.a)+'</b></div>'}).join(''):'<p class="note">No payments yet.</p>';
 $('body').innerHTML=b;
}
function pickStore(v){sel=v;showAdd()}
function showAdd(){var keep=$('cn')?$('cn').value:'';$('addbox').innerHTML='<div class="card">'+chips(STORES,'pickStore')+'<input id="cn" inputmode="numeric" placeholder="Card number" value="'+esc(keep)+'"><button class="btn" onclick="addCard()">Save card</button></div>'}
function addCard(){var n=$('cn').value.trim();if(!sel||!n)return toast('Pick a store and enter the number');S.cards.push({store:sel,num:n});sel='';save();render()}
var COL={'Shoprite':'#C62828','Pick n Pay':'#1565C0','Checkers':'#00838F','Clicks':'#2E7D32','Woolworths':'#202124','Spar':'#6A1B9A'},idx=0,draft={store:'',num:''},bdet=null,zr=null;
function colFor(s){for(var k in COL)if(s.indexOf(k)===0)return COL[k];return '#5F6368'}
function cardHTML(c,i,sm){return '<div class="wc'+(sm?' sm':'')+'" style="background:'+colFor(c.store)+'"'+(sm?' onclick="openCard('+i+')"':'')+'><span class="wl">'+esc(c.store[0])+'</span><b>'+esc(c.store)+'</b><span class="wn">'+esc(c.num)+'</span></div>'}
function drawBc(q,n){try{JsBarcode(q,String(n).replace(/\s/g,''),{format:'CODE128',displayValue:false,height:80,margin:0,width:2})}catch(e){}}
function openCard(i){idx=i;scr='card';render()}
function cardView(){
 var c=S.cards[idx];if(!c){scr='main';return render()}
 $('body').innerHTML='<div id="sw">'+cardHTML(c)+'</div><div class="dots">'+S.cards.map(function(x,i){return '<i class="'+(i===idx?'on':'')+'"></i>'}).join('')+'</div><div class="bcp"><svg id="bc"></svg></div><p class="num">'+esc(c.num)+'</p><p class="note" style="text-align:center">Hold this up to the checkout scanner. Swipe to see your other cards.</p><button class="btn g" onclick="delCard()">Remove card</button>';
 drawBc('#bc',c.num);
 var x0=0,sw=$('sw');sw.ontouchstart=function(e){x0=e.touches[0].clientX};sw.ontouchend=function(e){var dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50){idx=(idx+(dx<0?1:S.cards.length-1))%S.cards.length;render()}};
}
function delCard(){S.cards.splice(idx,1);save();scr='main';render()}
function openAdd(){draft={store:'',num:''};sel='';scr='add';render()}
function pickStore2(v){draft.store=v;sel=v;addScreen()}
function addScreen(){
 $('body').innerHTML='<h2>Store</h2>'+chips(STORES,'pickStore2')+'<h2>Card number</h2><input id="cn" inputmode="numeric" placeholder="Type the card number" oninput="draft.num=this.value;prev()" value="'+esc(draft.num)+'"><button class="btn t" onclick="scanCard()">Scan the card’s barcode</button><div id="scanbox"></div><div id="prev" style="margin-top:16px"></div><button class="btn" onclick="saveCard()">Save card</button>';
 prev();
}
function prev(){var p=$('prev');if(!p)return;var n=draft.num.trim();if(!draft.store&&!n){p.innerHTML='';return}p.innerHTML=cardHTML({store:draft.store||'Choose a store',num:n||'Card number'})+(n?'<div class="bcp"><svg id="bc2"></svg></div>':'');if(n)drawBc('#bc2',n)}
function saveCard(){var n=draft.num.trim();if(!draft.store||!n)return toast('Pick a store and add the card number');S.cards.push({store:draft.store,num:n});save();scr='main';tab='wallet';sel='';render();toast('Card added')}
function scanCard(){
 $('scanbox').innerHTML='<div class="cam" style="margin-top:10px"><video id="vid" playsinline muted></video></div><p class="note" id="camerr">Hold the barcode inside the frame.</p>';
 if(!navigator.mediaDevices)return err2('Camera is not available here. Type the number instead.');
 navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(function(s){stream=s;var v=$('vid');if(!v){stopCam();return}v.srcObject=s;v.play();bloop()}).catch(function(){err2('Camera is blocked. Allow it, or type the number.')});
}
function bloop(){
 var v=$('vid');if(!v||!stream)return;
 var next=function(){raf=setTimeout(bloop,150)};
 if(!(v.readyState===4&&v.videoWidth))return next();
 var got=function(t){stopCam();draft.num=t;var i=$('cn');if(i)i.value=t;var b=$('scanbox');if(b)b.innerHTML='';prev();toast('Barcode read')};
 if('BarcodeDetector' in window){bdet=bdet||new BarcodeDetector();bdet.detect(v).then(function(r){r.length?got(r[0].rawValue):next()}).catch(next);return}
 try{var c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);zr=zr||new ZXing.MultiFormatReader();got(zr.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(c)))).getText())}catch(e){next()}
}
function pay(who,a,inn){S.hist.unshift({who:who,a:a,in:inn});save();tab='wallet';render();toast((inn?'Received ':'Paid ')+money(a))}
function scan(){
 $('body').innerHTML='<h2>Scan to pay</h2><div class="cam"><video id="vid" playsinline muted></video></div><p class="note" id="camerr">Point the camera at a payment QR code.</p><button class="btn t" onclick="demoScan()">Try a demo QR (tap again for another type)</button>';
 if(!navigator.mediaDevices||!window.jsQR){return err2('Camera scanning is not available here.')}
 navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(function(s){stream=s;var v=$('vid');if(!v){stopCam();return}v.srcObject=s;v.play();loop()}).catch(function(){err2('Camera is blocked. Allow camera access in your browser, or use the demo button.')});
}
function err2(m){var e=$('camerr');if(e)e.textContent=m}
function loop(){var v=$('vid');if(!v||!stream)return;if(v.readyState===4&&v.videoWidth){var c=document.createElement('canvas');c.width=v.videoWidth/2;c.height=v.videoHeight/2;var x=c.getContext('2d');x.drawImage(v,0,0,c.width,c.height);var im=x.getImageData(0,0,c.width,c.height),r=jsQR(im.data,c.width,c.height);if(r&&r.data){var m=readQR(r.data);if(m){stopCam();return confirmPay(m)}}}raf=requestAnimationFrame(loop)}
function stopCam(){if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}cancelAnimationFrame(raf);clearTimeout(raf)}
function demoScan(){stopCam();confirmPay({name:'Mama Thandi Vetkoek',amount:35})}
function confirmPay(m){
 var sh=document.createElement('div');sh.className='sheet';sh.id='sheet';
 sh.innerHTML='<p class="note">Paying</p><strong style="font-size:22px">'+esc(m.name)+'</strong>'+(m.amount?'<div class="big">'+money(m.amount)+'</div>':'<input id="pa" inputmode="decimal" placeholder="Amount (R)" style="margin-top:12px">')+'<button class="btn" id="pb">Pay</button><button class="btn g" id="pc">Cancel</button>';
 $('app').appendChild(sh);
 $('pb').onclick=function(){var a=m.amount||parseFloat($('pa').value);if(!(a>0))return toast('Enter an amount');sh.remove();pay(m.name,a,false)};
 $('pc').onclick=function(){sh.remove();render()};
}
function tap(){
 $('body').innerHTML='<div style="text-align:center;padding:40px 12px"><div class="logo" style="margin:0 auto;width:96px;height:96px;font-size:60px">P</div><h1>Tap to pay</h1><p class="note">Paying with a tap needs the installed PayWise Android app, because websites can’t make your phone act like a card. Scan works right now.</p><button class="btn" onclick="go(\'scan\')">Scan to pay instead</button></div>';
}
function paid(){
 var b=$('body');
 if(!S.payout){b.innerHTML='<h2>Where should your money go?</h2><p class="note">PayWise never holds your money. Payments go straight to the account you link.</p>'+chips(BANKS,'pickBank')+'<input id="ac" inputmode="numeric" placeholder="Account number"><button class="btn" onclick="linkBank()">Link account</button>';return}
 var u=S.user;
 b.innerHTML='<p class="note">Paid straight to '+esc(S.payout.bank)+' •••• '+esc(S.payout.l4)+'</p><input id="am" inputmode="decimal" placeholder="Amount (optional)"><div class="qr" id="qr"></div><button class="btn t" onclick="readTap()">Receive a tap</button><p class="note" id="nfcmsg">Customers scan the code, or tap with the PayWise Android app.</p>';
 var q=new QRCode($('qr'),{text:'x',width:200,height:200});
 function upd(){q.makeCode(buildQR(u.name+' '+u.surname,$('am').value,u.phone))}
 $('am').oninput=upd;upd();
}
function pickBank(v){sel=v;paid();$('body').querySelectorAll('.chip').forEach(function(c){if(c.textContent===v)c.className='chip on'})}
function linkBank(){var a=$('ac').value.trim();if(!sel||a.length<8)return toast('Pick a bank and enter the account number');S.payout={bank:sel,l4:a.slice(-4)};sel='';save();render()}
function readTap(){
 if(!('NDEFReader' in window))return $('nfcmsg').textContent='Receiving taps needs Chrome on an NFC Android phone.';
 var a=parseFloat($('am').value);if(!(a>0))return $('nfcmsg').textContent='Enter an amount first, then tap.';
 try{var r=new NDEFReader();r.scan().then(function(){$('nfcmsg').textContent='Ready. Hold the customer’s phone near yours…';r.onreading=function(){pay('Customer (tap)',a,true)}}).catch(function(){$('nfcmsg').textContent='NFC is off or blocked.'})}catch(e){$('nfcmsg').textContent='NFC is not available here.'}
}
function profile(){
 var u=S.user,av=u.photo?'<img class="av avxl" src="'+u.photo+'" alt="Profile photo">':'<span class="av avxl">'+esc(u.name[0].toUpperCase())+'</span>';
 var rows=[['Name',u.name+' '+u.surname],['Cell number',u.phone],['Email',u.email],['ID number',u.idm],['Payout account',S.payout?S.payout.bank+' •••• '+S.payout.l4:'Not linked']];

 var b=S.bank,v=b.name==='Visa',m=b.name==='Mastercard';
 var bg=v?'linear-gradient(135deg,#1a1f71,#2f49d1)':m?'linear-gradient(135deg,#1c1c1e,#4a4a4f)':'linear-gradient(135deg,#202124,#5f6368)';
 var lg2=v?'<em style="font-style:italic;font-weight:900;font-size:24px;letter-spacing:-1px">VISA</em>':m?'<span class="mc"><i style="background:#EB001B"></i><i style="background:#F79E1B"></i></span>':'<b>CARD</b>';
 return '<div class="bcard" onclick="openBank()" style="background:'+bg+'"><div class="bt"><span class="chip2"></span><span class="ctl">)))</span></div><div class="bn">•••• •••• •••• '+esc(b.l4)+'</div><div class="bb"><span>'+esc((b.holder||'').toUpperCase())+'</span>'+lg2+'</div></div>';
}
function wallet(){
 var bk=S.bank?bankCardHTML():'<div class="bcard empty" onclick="openBank()"><strong style="font-size:18px">Link your bank card</strong><small style="margin-top:6px;color:var(--mute)">Add your card once, then pay with one tap</small></div>';
 $('body').innerHTML='<h2>Bank cards</h2>'+bk+'<h2>Loyalty cards</h2>'+(S.cards.length?S.cards.map(function(c,i){return cardHTML(c,i,1)}).join(''):'<p class="note">No loyalty cards yet.</p>')+'<button class="btn t" onclick="openAdd()">+ Add loyalty card</button><h2>Recent activity</h2>'+(S.hist.length?S.hist.map(function(h){return '<div class="row"><span>'+(h.in?'From ':'To ')+esc(h.who)+'</span><b style="color:'+(h.in?'var(--ok)':'inherit')+'">'+(h.in?'+':'-')+money(h.a)+'</b></div>'}).join(''):'<p class="note">No payments yet.</p>');
}
